<script>

  /* =================================================
   * CONFIG
   * ================================================= */

  var LIFF_ID =
    '2011608457-HhlDakb3';

  var API_URL =
    'https://script.google.com/macros/s/AKfycbzNcIThEeOcE9I_am2IV_rXTIaDC1nCgRtZWrt5UhdjaLPdRds0wdPhpDfqYdi77Q4BTA/exec';


  var currentUser = null;

  var users = [];

  var selectedAssignees = [];


  /* =================================================
   * START
   * ================================================= */

  window.addEventListener(
    'load',
    startSystem
  );


  async function startSystem() {

    try {

      setStatus(
        'กำลังตรวจสอบ LINE...'
      );

      debugText(
        'เริ่มต้นระบบ'
      );


      /* ---------------------------------------------
       * ตรวจว่า LIFF SDK โหลดแล้วหรือยัง
       * --------------------------------------------- */

      if (
        typeof liff === 'undefined'
      ) {

        throw new Error(
          'ไม่พบ LINE LIFF SDK'
        );

      }


      debugText(
        'กำลังเริ่ม LIFF...'
      );


      /* ---------------------------------------------
       * LIFF INIT
       * --------------------------------------------- */

      await liff.init({

        liffId:
          LIFF_ID,

        withLoginOnExternalBrowser:
          true

      });


      debugText(
        'LIFF พร้อมใช้งาน'
      );


      /* ---------------------------------------------
       * LOGIN
       * --------------------------------------------- */

      if (
        !liff.isLoggedIn()
      ) {

        setStatus(
          'กำลังเข้าสู่ระบบ LINE...'
        );

        debugText(
          'ยังไม่ได้ Login → กำลังเปิด LINE Login'
        );

        liff.login();

        return;

      }


      /* ---------------------------------------------
       * GET PROFILE
       * --------------------------------------------- */

      setStatus(
        'กำลังอ่านข้อมูล LINE...'
      );

      debugText(
        'กำลังโหลด Profile'
      );


      var profile =
        await liff.getProfile();


      if (
        !profile ||
        !profile.userId
      ) {

        throw new Error(
          'ไม่สามารถอ่าน LINE User ID ได้'
        );

      }


      currentUser = {

        userId:
          profile.userId,

        displayName:
          profile.displayName || ''

      };


      debugText(
        'LINE: ' +
        currentUser.displayName
      );


      /* ---------------------------------------------
       * CALL BACKEND
       * --------------------------------------------- */

      setStatus(
        'กำลังโหลดข้อมูลระบบ...'
      );

      debugText(
        'กำลังเชื่อมต่อ Google Apps Script'
      );


      var data =
        await apiGet(
          'initialData',
          {

            userId:
              currentUser.userId,

            displayName:
              currentUser.displayName

          }
        );


      debugText(
        'ได้รับข้อมูลจากระบบแล้ว'
      );


      if (
        !data ||
        data.success !== true
      ) {

        throw new Error(
          data && data.error
            ? data.error
            : 'ระบบไม่สามารถส่งข้อมูลกลับมาได้'
        );

      }


      /* ---------------------------------------------
       * SET DATA
       * --------------------------------------------- */

      currentUser =
        data.user || currentUser;

      users =
        Array.isArray(data.users)
          ? data.users
          : [];


      renderCurrentUser();

      renderCategories(
        Array.isArray(data.categories)
          ? data.categories
          : []
      );

      renderUsers();

      renderSelectedAssignees();

      renderAssigneeSelect();


      /* ---------------------------------------------
       * SHOW APP
       * --------------------------------------------- */

      document
        .getElementById('loading')
        .style.display =
          'none';


      document
        .getElementById('mainContent')
        .style.display =
          'block';


      setStatus('');

    }

    catch (error) {

      console.error(
        'PPM ERROR:',
        error
      );


      var message =
        error &&
        error.message
          ? error.message
          : String(error);


      document
        .getElementById('loading')
        .innerHTML =
          'เกิดข้อผิดพลาด<br><br>' +
          '<strong>' +
          escapeHtml(message) +
          '</strong>' +
          '<div class="debug">' +
          'เปิด Console ของ Browser เพื่อดูรายละเอียดเพิ่มเติม' +
          '</div>';

    }

  }


  /* =================================================
   * JSONP API
   * ================================================= */

  function apiGet(
    action,
    params
  ) {

    return new Promise(
      function(resolve, reject) {

        var callbackName =
          'ppmJsonp_' +
          Date.now() +
          '_' +
          Math.floor(
            Math.random() * 1000000
          );


        var script =
          document.createElement(
            'script'
          );


        var finished =
          false;


        var timeoutId =
          null;


        function cleanup() {

          if (
            timeoutId
          ) {

            clearTimeout(
              timeoutId
            );

          }


          try {

            delete window[
              callbackName
            ];

          }

          catch (e) {

            window[
              callbackName
            ] = undefined;

          }


          if (
            script &&
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

        }


        function finishSuccess(
          data
        ) {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          resolve(data);

        }


        function finishError(
          error
        ) {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(error);

        }


        /*
         * สำคัญ:
         * callback ต้องอยู่บน window
         * เพราะ Google Apps Script จะเรียก
         * window.callbackName(...)
         */

        window[
          callbackName
        ] = function(data) {

          console.log(
            'PPM JSONP response:',
            data
          );

          finishSuccess(data);
