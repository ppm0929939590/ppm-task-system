<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PPM Work Plan</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .user-box {
      background: white;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow:
        0 2px 10px rgba(0,0,0,.05);
    }

    .user-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }

    .user-name {
      font-size: 16px;
      font-weight: 600;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow:
        0 2px 12px rgba(0,0,0,.05);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .required {
      color: #e53935;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 11px;
      padding: 12px 13px;
      font-size: 15px;
      font-family: inherit;
      background: white;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #111;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .assignee-box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
      background: #fff;
    }

    .assignee-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 30px;
    }

    .assignee-empty {
      color: #999;
      font-size: 14px;
      padding: 4px;
    }

    .assignee-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0f1f3;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
    }

    .assignee-chip button {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      font-size: 16px;
      line-height: 1;
      color: #777;
    }

    .assignee-select {
      margin-top: 10px;
    }

    .assignee-select select {
      width: 100%;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 7px;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #111;
      color: white;
    }

    .button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin: 15px 0;
      font-size: 14px;
      color: #777;
    }

    .success {
      background: #eef8ef;
      color: #24752b;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      display: none;
    }

    .success strong {
      display: block;
      margin-bottom: 4px;
    }

    .error {
      background: #fff0f0;
      color: #c62828;
      border-radius: 12px;
      padding: 13px;
      margin-top: 15px;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }

  </style>
</head>


<body>

  <div class="container">

    <div class="header">

      <h1>เพิ่มงานใหม่</h1>

      <p>
        PPM Work Plan
      </p>

    </div>


    <div
      id="loading"
      class="loading"
    >
      กำลังเชื่อมต่อ LINE...
    </div>


    <div
      id="mainContent"
      style="display:none;"
    >

      <div class="user-box">

        <div class="user-label">
          ผู้บันทึกงาน
        </div>

        <div
          id="currentUserName"
          class="user-name"
        >
          -
        </div>

      </div>


      <div class="card">

        <!-- หมวดหมู่ -->

        <div class="field">

          <label>
            หมวดหมู่งาน
            <span class="required">*</span>
          </label>

          <select id="category">

            <option value="">
              เลือกหมวดหมู่
            </option>

          </select>

        </div>


        <!-- ลูกค้า -->

        <div class="field">

          <label>
            ลูกค้า
            <span class="required">*</span>
          </label>

          <input
            id="customer"
            type="text"
            placeholder="ระบุชื่อลูกค้า"
          >

        </div>


        <!-- สถานที่ -->

        <div class="field">

          <label>
            สถานที่
          </label>

          <input
            id="location"
            type="text"
            placeholder="ระบุสถานที่"
          >

        </div>


        <!-- รายละเอียด -->

        <div class="field">

          <label>
            รายละเอียดงาน
            <span class="required">*</span>
          </label>

          <textarea
            id="detail"
            placeholder="รายละเอียดงานที่ต้องทำ"
          ></textarea>

        </div>


        <!-- ผู้รับผิดชอบหลายคน -->

        <div class="field">

          <label>
            ผู้รับผิดชอบ
            <span class="required">*</span>
          </label>


          <div class="assignee-box">

            <div
              id="assigneeList"
              class="assignee-list"
            >

              <div class="assignee-empty">
                ยังไม่ได้เลือกผู้รับผิดชอบ
              </div>

            </div>


            <div class="assignee-select">

              <select id="assigneeSelect">

                <option value="">
                  + เพิ่มผู้รับผิดชอบ
                </option>

              </select>

            </div>

          </div>


          <div class="hint">
            สามารถเลือกผู้รับผิดชอบได้มากกว่า 1 คน
          </div>

        </div>


        <!-- ผู้ตรวจ -->

        <div class="field">

          <label>
            ผู้ตรวจ
          </label>

          <select id="reviewer">

            <option value="">
              เลือกผู้ตรวจ
            </option>

          </select>

        </div>


        <!-- กำหนดส่ง -->

        <div class="field">

          <label>
            กำหนดส่ง
            <span class="required">*</span>
          </label>

          <input
            id="dueDate"
            type="date"
          >

        </div>


        <button
          id="saveButton"
          class="button"
          onclick="saveJob()"
        >
          เพิ่มงาน
        </button>


        <div
          id="status"
          class="status"
        ></div>


        <div
          id="successBox"
          class="success"
        >

          <strong>
            เพิ่มงานเรียบร้อยแล้ว 🎉
          </strong>

          <div id="successMessage"></div>

        </div>


        <div
          id="errorBox"
          class="error"
        ></div>

      </div>

    </div>

  </div>


<script>

  const LIFF_ID =
    '2011608457-HhlDakb3';


  const API_URL =
    'https://script.google.com/macros/s/AKfycbzNcIThEeOcE9I_am2IV_rXTIaDC1nCgRtZWrt5UhdjaLPdRds0wdPhpDfqYdi77Q4BTA/exec';


  let currentUser = null;

  let users = [];

  let selectedAssignees = [];


  /* =================================================
   * START
   * ================================================= */

  window.addEventListener(
    'load',
    startSystem
  );


  async function startSystem() {

    try {

      setStatus(
        'กำลังโหลด LINE...'
      );


      await liff.init({

        liffId: LIFF_ID,

        withLoginOnExternalBrowser: true

      });


      if (!liff.isLoggedIn()) {

        liff.login();

        return;

      }


      const profile =
        await liff.getProfile();


      currentUser = {

        userId:
          profile.userId,

        displayName:
          profile.displayName

      };


      setStatus(
        'กำลังโหลดข้อมูลระบบ...'
      );


      const data =
        await apiGet(
          'initialData',
          {

            userId:
              currentUser.userId,

            displayName:
              currentUser.displayName

          }
        );


      if (!data.success) {

        throw new Error(
          data.error ||
          'ไม่สามารถโหลดข้อมูลได้'
        );

      }


      currentUser =
        data.user;

      users =
        data.users || [];


      renderCurrentUser();

      renderCategories(
        data.categories || []
      );

      renderUsers();

      renderAssigneeSelect();


      document
        .getElementById('loading')
        .style.display = 'none';


      document
        .getElementById('mainContent')
        .style.display = 'block';


      setStatus('');


    } catch (error) {

      console.error(error);

      document
        .getElementById('loading')
        .innerText =
          'เกิดข้อผิดพลาด: ' +
          (error.message || error);

    }

  }


  /* =================================================
   * API JSONP
   * ================================================= */

  function apiGet(
    action,
    params
  ) {

    return new Promise(
      function(resolve, reject) {

        const callbackName =
          'ppmCallback_' +
          Date.now() +
          '_' +
          Math.floor(
            Math.random() * 100000
          );


        const query =
          new URLSearchParams({

            action: action,

            callback: callbackName,

            ...params

          });


        const script =
          document.createElement(
            'script'
          );


        const timeout =
          setTimeout(
            function() {

              cleanup();

              reject(
                new Error(
                  'API timeout'
                )
              );

            },
            20000
          );


        window[callbackName] =
          function(data) {

            cleanup();

            resolve(data);

          };


        function cleanup() {

          clearTimeout(timeout);

          delete window[callbackName];

          if (script.parentNode) {

            script.parentNode.removeChild(
              script
            );

          }

        }


        script.onerror =
          function() {

            cleanup();

            reject(
              new Error(
                'ไม่สามารถเชื่อมต่อระบบได้'
              )
            );

          };


        script.src =
          API_URL +
          '?' +
          query.toString();


        document
          .body
          .appendChild(script);

      }
    );

  }


  /* =================================================
   * RENDER
   * ================================================= */

  function renderCurrentUser() {

    document
      .getElementById(
        'currentUserName'
      )
      .textContent =
        currentUser.systemName ||
        currentUser.displayName ||
        '-';

  }


  function renderCategories(
    categories
  ) {

    const select =
      document.getElementById(
        'category'
      );


    categories.forEach(
      function(category) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          category;

        option.textContent =
          category;

        select.appendChild(
          option
        );

      }
    );

  }


  function renderUsers() {

    const reviewer =
      document.getElementById(
        'reviewer'
      );


    /*
     * ผู้ตรวจ
     */

    users.forEach(
      function(user) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          user.userId;

        option.textContent =
          user.name;

        reviewer.appendChild(
          option
        );

      }
    );

  }


  function renderAssigneeSelect() {

    const select =
      document.getElementById(
        'assigneeSelect'
      );


    /*
     * ล้าง option เดิม
     */

    select.innerHTML = '';


    const firstOption =
      document.createElement(
        'option'
      );

    firstOption.value = '';

    firstOption.textContent =
      '+ เพิ่มผู้รับผิดชอบ';

    select.appendChild(
      firstOption
    );


    users.forEach(
      function(user) {

        /*
         * ถ้าเลือกไปแล้ว
         * ไม่ต้องแสดงซ้ำ
         */

        const alreadySelected =
          selectedAssignees
            .some(
              function(item) {

                return (
                  item.userId ===
                  user.userId
                );

              }
            );


        if (
          alreadySelected
        ) {

          return;

        }


        const option =
          document.createElement(
            'option'
          );

        option.value =
          user.userId;

        /*
         * สำคัญ:
         * แสดงเฉพาะชื่อ
         * ไม่แสดง Role
         */

        option.textContent =
          user.name;


        select.appendChild(
          option
        );

      }
    );


    select.onchange =
      function() {

        const userId =
          this.value;


        if (!userId) {
          return;
        }


        const user =
          users.find(
            function(item) {

              return (
                item.userId ===
                userId
              );

            }
          );


        if (!user) {
          return;
        }


        selectedAssignees.push(
          user
        );


        renderSelectedAssignees();

        renderAssigneeSelect();


        this.value = '';

      };

  }


  function renderSelectedAssignees() {

    const container =
      document.getElementById(
        'assigneeList'
      );


    container.innerHTML = '';


    if (
      selectedAssignees.length === 0
    ) {

      const empty =
        document.createElement(
          'div'
        );

      empty.className =
        'assignee-empty';

      empty.textContent =
        'ยังไม่ได้เลือกผู้รับผิดชอบ';

      container.appendChild(
        empty
      );

      return;

    }


    selectedAssignees.forEach(
      function(user, index) {

        const chip =
          document.createElement(
            'div'
          );

        chip.className =
          'assignee-chip';


        const name =
          document.createElement(
            'span'
          );

        name.textContent =
          user.name;


        const remove =
          document.createElement(
            'button'
          );

        remove.type =
          'button';

        remove.textContent =
          '×';

        remove.title =
          'ลบผู้รับผิดชอบ';


        remove.onclick =
          function() {

            selectedAssignees.splice(
              index,
              1
            );

            renderSelectedAssignees();

            renderAssigneeSelect();

          };


        chip.appendChild(name);

        chip.appendChild(remove);

        container.appendChild(chip);

      }
    );

  }


  /* =================================================
   * SAVE JOB
   * ================================================= */

  async function saveJob() {

    hideMessages();


    if (
      !currentUser ||
      !currentUser.userId
    ) {

      showError(
        'ไม่พบข้อมูล LINE User'
      );

      return;

    }


    const category =
      document
        .getElementById('category')
        .value;


    const customer =
      document
        .getElementById('customer')
        .value
        .trim();


    const location =
      document
        .getElementById('location')
        .value
        .trim();


    const detail =
      document
        .getElementById('detail')
        .value
        .trim();


    const reviewerId =
      document
        .getElementById('reviewer')
        .value;


    const dueDate =
      document
        .getElementById('dueDate')
        .value;


    if (!category) {

      showError(
        'กรุณาเลือกหมวดหมู่งาน'
      );

      return;

    }


    if (!customer) {

      showError(
        'กรุณาระบุชื่อลูกค้า'
      );

      return;

    }


    if (!detail) {

      showError(
        'กรุณาระบุรายละเอียดงาน'
      );

      return;

    }


    if (
      selectedAssignees.length === 0
    ) {

      showError(
        'กรุณาเลือกผู้รับผิดชอบอย่างน้อย 1 คน'
      );

      return;

    }


    if (!dueDate) {

      showError(
        'กรุณาระบุกำหนดส่ง'
      );

      return;

    }


    const button =
      document.getElementById(
        'saveButton'
      );


    button.disabled = true;

    button.textContent =
      'กำลังบันทึก...';


    try {

      const assigneeIds =
        selectedAssignees
          .map(
            function(user) {

              return user.userId;

            }
          )
          .join(',');


      const result =
        await apiGet(
          'saveJob',
          {

            reporterId:
              currentUser.userId,

            category:
              category,

            customer:
              customer,

            location:
              location,

            detail:
              detail,

            assigneeIds:
              assigneeIds,

            reviewerId:
              reviewerId,

            dueDate:
              dueDate

          }
        );


      if (!result.success) {

        throw new Error(
          result.error ||
          'ไม่สามารถบันทึกงานได้'
        );

      }


      document
        .getElementById(
          'successMessage'
        )
        .textContent =
          'รหัสงาน: ' +
          result.jobId +
          ' | ผู้รับผิดชอบ: ' +
          result.assignees;


      document
        .getElementById(
          'successBox'
        )
        .style.display =
          'block';


      /*
       * ล้างฟอร์ม
       */

      document
        .getElementById(
          'category'
        )
        .value = '';


      document
        .getElementById(
          'customer'
        )
        .value = '';


      document
        .getElementById(
          'location'
        )
        .value = '';


      document
        .getElementById(
          'detail'
        )
        .value = '';


      document
        .getElementById(
          'reviewer'
        )
        .value = '';


      document
        .getElementById(
          'dueDate'
        )
        .value = '';


      selectedAssignees = [];


      renderSelectedAssignees();

      renderAssigneeSelect();


    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        'เกิดข้อผิดพลาด'
      );

    }


    button.disabled = false;

    button.textContent =
      'เพิ่มงาน';

  }


  /* =================================================
   * UI
   * ================================================= */

  function setStatus(text) {

    document
      .getElementById(
        'status'
      )
      .textContent =
        text || '';

  }


  function hideMessages() {

    document
      .getElementById(
        'successBox'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'errorBox'
      )
      .style.display =
        'none';

  }


  function showError(message) {

    const box =
      document.getElementById(
        'errorBox'
      );

    box.textContent =
      message;

    box.style.display =
      'block';

  }

</script>

</body>
</html>
